name: Recordings

# Records the clips shown in the README on an emulator. Run by hand, or by pushing to the "recordings"
# branch. The clips are published as a download; the GIFs made from them are committed by a person
# who has looked at them.
on:
  workflow_dispatch:
  push:
    branches: [recordings]

concurrency:
  group: recordings
  cancel-in-progress: true

jobs:
  record:
    name: Record clips (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and tests
        run: ./gradlew --no-daemon -Pandroid.injected.build.abi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Record on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/record_demos.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: recordings
          path: recordings-output/
          if-no-files-found: ignore
      - name: Publish clips
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d recordings-output ] || exit 0
          tar czf recordings.tar.gz recordings-output
          gh release delete recordings-latest --yes --cleanup-tag || true
          gh release create recordings-latest recordings.tar.gz \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "README recordings $GITHUB_RUN_NUMBER" \
            --notes "Clips of the app recorded on the emulator at ${GITHUB_SHA::7}, for the README. Not a release."
