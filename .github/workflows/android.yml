name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native layer tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build fonts-dejavu-core
      - name: Run tests
        run: hosttest/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-test-renders
          path: hosttest/out/*.png
          if-no-files-found: ignore

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk pocketpadpp-spike.apk
      - uses: actions/upload-artifact@v6
        with:
          name: pocketpadpp-spike-apk
          path: pocketpadpp-spike.apk
      # A rolling pre-release gives the phone a direct download link for the newest build.
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/scintilla-spike')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release create spike-latest pocketpadpp-spike.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Scintilla spike (build $GITHUB_RUN_NUMBER)" \
            --notes "Automatic development build of the Scintilla-on-Android spike from $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Signed with the public development key in the repository. Not a release."
