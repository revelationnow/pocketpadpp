name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native layer tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build fonts-dejavu-core
      - name: Run tests
        run: hosttest/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-test-renders
          path: hosttest/out/*.png
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and tests
        run: ./gradlew --no-daemon -Pandroid.injected.build.abi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Run tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/run_ui_tests.sh
      # Screenshots from every step of the walkthrough, for reviewing the app without a phone.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-test-output
          path: ui-test-output/
          if-no-files-found: ignore
      # The same files as a release download, which is easier to fetch than a workflow artifact.
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d ui-test-output ] || exit 0
          tar czf ui-test-output.tar.gz ui-test-output
          gh release delete ui-test-latest --yes --cleanup-tag || true
          gh release create ui-test-latest ui-test-output.tar.gz \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "UI test screenshots $GITHUB_RUN_NUMBER" \
            --notes "Screenshots, logs and reports from the emulator walkthrough of $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Not a release."

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk pocketpadpp-dev.apk
      - uses: actions/upload-artifact@v6
        with:
          name: pocketpadpp-dev-apk
          path: pocketpadpp-dev.apk
      # A rolling pre-release gives the phone a direct download link for the newest build.
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/scintilla-spike')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest pocketpadpp-dev.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build $GITHUB_RUN_NUMBER" \
            --notes "Automatic development build from $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Signed with the public development key in the repository. Not a release."
