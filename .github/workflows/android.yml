name: Android build

on:
  push:
    # The "recordings" branch only makes the README's clips, see recordings.yml.
    branches-ignore: [recordings]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native layer tests (desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build fonts-dejavu-core
      - name: Run tests
        run: hosttest/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-test-renders
          path: hosttest/out/*.png
          if-no-files-found: ignore

  sanitizer-tests:
    name: Native layer tests under sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build fonts-dejavu-core
      # The same desktop tests, with the C++ built to stop at memory errors and undefined behaviour.
      - name: Run tests with the address and undefined-behaviour sanitizers
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          SANITIZE=1 hosttest/run.sh

  ui-tests:
    name: UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and tests
        run: ./gradlew --no-daemon -Pandroid.injected.build.abi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Run tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/run_ui_tests.sh
      # Screenshots from every step of the walkthrough, for reviewing the app without a phone.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-test-output
          path: ui-test-output/
          if-no-files-found: ignore
      # The same files as a release download, which is easier to fetch than a workflow artifact.
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d ui-test-output ] || exit 0
          tar czf ui-test-output.tar.gz ui-test-output
          gh release delete ui-test-latest --yes --cleanup-tag || true
          gh release create ui-test-latest ui-test-output.tar.gz \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "UI test screenshots $GITHUB_RUN_NUMBER" \
            --notes "Screenshots, logs and reports from the emulator walkthrough of $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Not a release."

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the signed statement that the APK was built here from this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk pocketpadpp-dev.apk
          sha256sum pocketpadpp-dev.apk | tee pocketpadpp-dev.apk.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: pocketpadpp-dev-apk
          path: pocketpadpp-dev.apk
      # Build provenance: GitHub signs a statement that this exact file was built by this workflow from this
      # commit. Anyone can check a download against it with `gh attestation verify`. See README, "Checking a download".
      - name: Attest the APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: pocketpadpp-dev.apk
      # The same check a person would make, so that a build whose attestation does not verify never goes out.
      - name: Check the attestation
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            gh attestation verify pocketpadpp-dev.apk --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" && exit 0
            sleep 10
          done
          exit 1
      # A rolling pre-release gives the phone a direct download link for the newest build.
      - name: Publish rolling pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum="$(cut -d' ' -f1 pocketpadpp-dev.apk.sha256)"
          {
            echo "Automatic development build from \`$GITHUB_REF_NAME\` at $GITHUB_SHA. Not a store release."
            echo
            echo "SHA-256 of \`pocketpadpp-dev.apk\`:"
            echo
            echo "    $sum"
            echo
            echo "To check that the file was built by this repository's own workflow from that commit:"
            echo
            echo "    gh attestation verify pocketpadpp-dev.apk --repo $GITHUB_REPOSITORY"
            echo
            echo "The APK is signed with the public development key in the repository, so its signature alone does not"
            echo "say who built it; the check above does. See the README, \"Checking a download\"."
          } > notes.md
          gh release delete spike-latest --yes --cleanup-tag || true
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest pocketpadpp-dev.apk pocketpadpp-dev.apk.sha256 \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build $GITHUB_RUN_NUMBER" \
            --notes-file notes.md
